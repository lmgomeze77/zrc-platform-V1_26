name: GeoRisk data checks
on:
  pull_request:
    paths:
      - 'src/worker/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
      - 'src/pages/intelligence/**'
      - 'src/components/GeoRiskMarketData.jsx'
      - 'src/pages/PricingPage.jsx'
      - 'scripts/georisk-market.test.js'
      - 'scripts/georisk-macro.test.js'
      - 'scripts/georisk-wgi.test.js'
      - 'src/components/GeoRiskGovernanceData.jsx'
      - 'src/components/GeoRiskMacroData.jsx'
      - 'src/components/GeoRiskGprData.jsx'
      - 'scripts/georisk-gpr.test.js'
      - 'scripts/collect-georisk-fred.py'
      - 'scripts/georisk-fred-python.test.py'
      - 'public/data/georisk-fred-cpi.json'
      - '.github/workflows/georisk-fred-refresh.yml'
      - 'scripts/collect-georisk-gpr.py'
      - 'scripts/georisk-gpr-python.test.py'
      - 'public/data/georisk-gpr.json'
      - '.github/workflows/georisk-gpr-refresh.yml'
      - '.github/workflows/georisk-data-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd==2.0.1
      - run: python scripts/georisk-gpr-python.test.py
      - run: python scripts/georisk-fred-python.test.py
      - run: node --test scripts/georisk-market.test.js scripts/georisk-macro.test.js scripts/georisk-wgi.test.js scripts/georisk-gpr.test.js
      - run: npx wrangler d1 migrations apply zrc-leads --local
      - run: npm run test:schema
      - run: npm run build
      - run: npx wrangler deploy --dry-run
