name: GeoRisk market research data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * 1-5'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser without network
        run: python scripts/georisk-market-research-python.test.py
      - name: Retrieve and validate observations
        run: python scripts/collect-georisk-market-research.py
      - name: Commit verified snapshot only
        run: |
          if git diff --quiet -- public/data/georisk-market-research.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/georisk-market-research.json
          git commit -m "data: refresh verified GeoRisk market research snapshot"
          git push
      # GITHUB_TOKEN pushes do not fire the regular push-triggered deploy.
      # Therefore build and deploy this verified capture explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      - name: Deploy verified historical snapshot
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
