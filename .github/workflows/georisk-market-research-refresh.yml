name: GeoRisk market research data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-georisk-market-research.py'
      - 'scripts/georisk-market-research-python.test.py'
      - '.github/workflows/georisk-market-research-refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * 1-5'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parser without network
        run: python scripts/georisk-market-research-python.test.py
      - name: Retrieve and validate observations
        run: python scripts/collect-georisk-market-research.py
      - name: Preserve source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: georisk-feed-diagnostics
          path: public/data/georisk-market-research.json
          retention-days: 14
      - name: Verify minimum independently sourced coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('public/data/georisk-market-research.json').read_text())
          ids={s['id'] for s in x.get('series',[])}
          print('Verified source IDs:',sorted(ids),'failures:',x.get('failures',[]))
          if len(ids)<2 or not ({'DCOILBRENTEU','DGS10'} <= ids):
              raise SystemExit('Critical Brent and Treasury feeds unavailable; refusing deploy')
          PY
      - name: Commit verified snapshot only
        run: |
          if git diff --quiet -- public/data/georisk-market-research.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/georisk-market-research.json
          git commit -m "data: refresh verified GeoRisk market research snapshot"
          git push
      # GITHUB_TOKEN pushes do not fire the regular push-triggered deploy.
      # Therefore build and deploy this verified capture explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      - name: Deploy verified historical snapshot
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
