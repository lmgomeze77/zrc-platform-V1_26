name: Daily Opportunities Refresh

on:
  schedule:
    # 06:15 UTC — offset from Daily Intelligence Refresh to avoid API contention
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit opportunities.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate opportunities
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate:opportunities

      - name: Commit & push if changed
        run: |
          git config user.name  "zrc-bot"
          git config user.email "bot@zenithrisecapital.com"
          git add public/data/opportunities.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily opportunities refresh [skip ci]"
            git push
          fi
