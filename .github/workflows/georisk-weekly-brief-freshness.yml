name: GeoRisk weekly brief freshness
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-georisk-weekly-brief.mjs --fresh
