name: GeoRisk GPR refresh

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: georisk-gpr-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'lmgomeze77/zrc-platform-V1_26'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd==2.0.1
      - run: python scripts/georisk-gpr-python.test.py
      - name: Download and validate official GPR workbooks
        run: python scripts/collect-georisk-gpr.py
      - name: Save changed source snapshot
        id: commit
        run: |
          if git diff --quiet -- public/data/georisk-gpr.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/georisk-gpr.json
            git commit -m 'data: refresh official GeoRisk GPR snapshot'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ needs.refresh.outputs.commit_sha }}
    secrets: inherit
