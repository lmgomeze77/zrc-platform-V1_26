name: Market Ticker Update

on:
  schedule:
    # Every 4 hours during market-relevant hours (06-22 UTC)
    - cron: '0 6,10,14,18,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Fetch live market data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-market.js

      # Keep the generated result outside the worktree. The headlines workflow
      # can advance main while this job is running, so the final step reapplies
      # only market_ticker/market_updated_at on top of the latest feed.
      - name: Preserve generated market payload
        run: cp public/data/headlines.json "$RUNNER_TEMP/generated-market.json"

      - name: Commit and push
        run: |
          git config user.name "ZRC Market Bot"
          git config user.email "bot@zenithrisecapital.com"

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/merge-generated-feed.js "$RUNNER_TEMP/generated-market.json" market
            git add public/data/headlines.json

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "📈 Market update — $(date -u +'%H:%M UTC')"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $i lost a race, rebuilding on latest main..."
            sleep 5
          done

          exit 1
