name: Daily Headlines Generator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-headlines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Generate headlines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-headlines.js

      - name: Commit and push
        run: |
          git config user.name "ZRC Headlines Bot"
          git config user.email "bot@zenithrisecapital.com"
          git add public/data/headlines.json
          git diff --cached --quiet || git commit -m "Daily headlines update 2026-04-12 23:25 UTC"
          git push
