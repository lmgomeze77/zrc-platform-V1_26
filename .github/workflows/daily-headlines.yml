name: Daily Headlines Generator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci installs the complete locked dependency set required by the
      # generator (RSS parser plus the Anthropic SDK).
      - name: Install dependencies
        run: npm ci

      - name: Generate headlines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-headlines.js

      # Keep the generated result outside the worktree. The market workflow can
      # advance main while the model is running, so the final step reapplies only
      # headlines/generated_at on top of the latest feed.
      - name: Preserve generated headlines
        run: cp public/data/headlines.json "$RUNNER_TEMP/generated-headlines.json"

      - name: Commit and push
        run: |
          git config user.name "ZRC Headlines Bot"
          git config user.email "bot@zenithrisecapital.com"

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/merge-generated-feed.js "$RUNNER_TEMP/generated-headlines.json" headlines
            git add public/data/headlines.json

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Daily headlines update — $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $i lost a race, rebuilding on latest main..."
            sleep 5
          done

          exit 1
